{% extends "base.html" %}

{% block content %}
<section class="py-5 min-vh-75 d-flex align-items-center text-center bg-white">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="p-5 rounded-4 shadow-sm bg-light border">
                    <div class="display-1 fw-bold text-primary mb-2">404</div>
                    <h1 class="h3 fw-bold text-dark mb-2">Page Not Found</h1>
                    <p class="text-muted small mb-4">
                        The page or publication you are looking for may have been moved, renamed, or is temporarily unavailable.
                    </p>
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'index' %}" class="btn btn-primary rounded-pill px-4 fw-bold">
                            <i class="fas fa-home me-2"></i> Return Home
                        </a>
                        <a href="{% url 'notices' %}" class="btn btn-outline-secondary rounded-pill px-4 fw-bold">
                            Browse Notices
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
