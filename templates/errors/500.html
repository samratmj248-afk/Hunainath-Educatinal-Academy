{% extends "base.html" %}

{% block content %}
<section class="py-5 min-vh-75 d-flex align-items-center text-center bg-white">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="p-5 rounded-4 shadow-sm bg-light border">
                    <div class="display-1 fw-bold text-danger mb-2">500</div>
                    <h1 class="h3 fw-bold text-dark mb-2">Internal Server Error</h1>
                    <p class="text-muted small mb-4">
                        Our technical team has been notified of this unexpected condition. Please try refreshing or return to the main homepage.
                    </p>
                    <a href="{% url 'index' %}" class="btn btn-primary rounded-pill px-4 fw-bold">
                        <i class="fas fa-home me-2"></i> Return to Homepage
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
